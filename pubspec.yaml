name: cifravault
description: "CifraVault — gerenciador local de cifras e setlists em arquivos Markdown."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  file_picker: ^13.4.1
  http: ^1.6.0
  yaml: ^3.1.4
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  html: ^0.15.7
  shared_preferences: ^2.5.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
